<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <!-- Four zones, each with one job: navigation, the page, document
         settings, and one line of state. Nothing has two homes. -->
    <div id="app">
      <div id="rail" contenteditable="false"></div>
      <div id="canvas">
        <div id="banner" hidden></div>
        <div id="formatbar"></div>
        <div id="doc" contenteditable="true" spellcheck="true"></div>
      </div>
      <aside id="inspector" contenteditable="false" aria-label="Document settings" hidden></aside>
    </div>
    <div id="statusbar" role="status" aria-live="polite"></div>
    <div id="measure" class="page-content" aria-hidden="true"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
